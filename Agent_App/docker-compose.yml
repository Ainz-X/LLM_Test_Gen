services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_agent}
      MYSQL_USER: ${MYSQL_USER:-a3_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-a3_agent_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-a3_agent_root_password}
    volumes:
      - a3_agent_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-a3_agent} -p${MYSQL_PASSWORD:-a3_agent_password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - a3_agent_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - a3_agent_etcd:/etcd

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      - etcd
      - minio
    volumes:
      - a3_agent_milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"

  backend:
    build:
      context: ../..
      dockerfile: LLM_Test_Gen/Agent_App/backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://a3_agent:a3_agent_password@db:3306/a3_agent?charset=utf8mb4}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ENABLE_JAVA_COMPILE: ${ENABLE_JAVA_COMPILE:-1}
      ENABLE_JAVA_COVERAGE: ${ENABLE_JAVA_COVERAGE:-1}
      JUNIT_CLASSPATH: ${JUNIT_CLASSPATH:-/opt/java-libs/junit-4.13.2.jar:/opt/java-libs/hamcrest-core-1.3.jar}
      JACOCO_AGENT_PATH: ${JACOCO_AGENT_PATH:-/opt/java-libs/org.jacoco.agent-0.8.12-runtime.jar}
      JACOCO_CLI_PATH: ${JACOCO_CLI_PATH:-/opt/java-libs/org.jacoco.cli-0.8.12-nodeps.jar}
      COMPILE_TIMEOUT_SECONDS: ${COMPILE_TIMEOUT_SECONDS:-20}
      TEST_TIMEOUT_SECONDS: ${TEST_TIMEOUT_SECONDS:-40}
      MINIO_ENABLED: ${MINIO_ENABLED:-1}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-a3-agent}
      MINIO_SECURE: ${MINIO_SECURE:-0}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      KNOWLEDGE_BASE_ENABLED: ${KNOWLEDGE_BASE_ENABLED:-0}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080}
      STORAGE_DIR: /app/storage
      PROJECT_ROOT: /app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      milvus:
        condition: service_started
    volumes:
      - a3_agent_storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  a3_agent_mysql:
  a3_agent_storage:
  a3_agent_minio:
  a3_agent_etcd:
  a3_agent_milvus:
