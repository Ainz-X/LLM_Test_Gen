services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_agent}
      MYSQL_USER: ${MYSQL_USER:-a3_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-a3_agent_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-a3_agent_root_password}
    volumes:
      - a3_agent_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-a3_agent} -p${MYSQL_PASSWORD:-a3_agent_password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - a3_agent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - a3_agent_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - a3_agent_etcd:/etcd

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      - etcd
      - minio
    volumes:
      - a3_agent_milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"

  backend:
    build:
      context: ../..
      dockerfile: LLM_Test_Gen/Agent_App/backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://a3_agent:a3_agent_password@db:3306/a3_agent?charset=utf8mb4}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ENABLE_JAVA_COMPILE: ${ENABLE_JAVA_COMPILE:-1}
      ENABLE_JAVA_COVERAGE: ${ENABLE_JAVA_COVERAGE:-1}
      JUNIT_CLASSPATH: ${JUNIT_CLASSPATH:-/opt/java-libs/junit-4.13.2.jar:/opt/java-libs/hamcrest-core-1.3.jar}
      JACOCO_AGENT_PATH: ${JACOCO_AGENT_PATH:-/opt/java-libs/org.jacoco.agent-0.8.12-runtime.jar}
      JACOCO_CLI_PATH: ${JACOCO_CLI_PATH:-/opt/java-libs/org.jacoco.cli-0.8.12-nodeps.jar}
      COMPILE_TIMEOUT_SECONDS: ${COMPILE_TIMEOUT_SECONDS:-20}
      TEST_TIMEOUT_SECONDS: ${TEST_TIMEOUT_SECONDS:-40}
      MAVEN_COMPILE_TIMEOUT_SECONDS: ${MAVEN_COMPILE_TIMEOUT_SECONDS:-300}
      MAVEN_TEST_TIMEOUT_SECONDS: ${MAVEN_TEST_TIMEOUT_SECONDS:-300}
      MAVEN_REPORT_TIMEOUT_SECONDS: ${MAVEN_REPORT_TIMEOUT_SECONDS:-180}
      CONTEXT_EXTRACT_TIMEOUT_SECONDS: ${CONTEXT_EXTRACT_TIMEOUT_SECONDS:-300}
      SANDBOX_RUNNER_ENABLED: ${SANDBOX_RUNNER_ENABLED:-1}
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8090}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-local-dev-runner-token-change-me}
      SANDBOX_RUNNER_TIMEOUT_SECONDS: ${SANDBOX_RUNNER_TIMEOUT_SECONDS:-360}
      MAX_PROJECT_ARCHIVE_BYTES: ${MAX_PROJECT_ARCHIVE_BYTES:-157286400}
      MAX_PROJECT_ARCHIVE_ENTRIES: ${MAX_PROJECT_ARCHIVE_ENTRIES:-10000}
      MAX_PROJECT_UNPACKED_BYTES: ${MAX_PROJECT_UNPACKED_BYTES:-786432000}
      MAX_PROJECT_COMPRESSION_RATIO: ${MAX_PROJECT_COMPRESSION_RATIO:-100}
      METHOD_CONTEXT_EXTRACTOR_JAR: ${METHOD_CONTEXT_EXTRACTOR_JAR:-/app/LLM_Test_Gen/Java_Scripts/method-context-extractor/target/method-context-extractor-0.2.0-SNAPSHOT-jar-with-dependencies.jar}
      MINIO_ENABLED: ${MINIO_ENABLED:-1}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-a3-agent}
      MINIO_SECURE: ${MINIO_SECURE:-0}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      KNOWLEDGE_BASE_ENABLED: ${KNOWLEDGE_BASE_ENABLED:-0}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080}
      STORAGE_DIR: /app/storage
      PROJECT_ROOT: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      milvus:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    volumes:
      - a3_agent_storage:/app/storage
      - a3_agent_maven_cache:/home/app/.m2
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    init: true
    networks:
      - default
      - sandbox

  worker:
    build:
      context: ../..
      dockerfile: LLM_Test_Gen/Agent_App/backend/Dockerfile
    command: ["celery", "-A", "app.celery_worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://a3_agent:a3_agent_password@db:3306/a3_agent?charset=utf8mb4}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ENABLE_JAVA_COMPILE: ${ENABLE_JAVA_COMPILE:-1}
      ENABLE_JAVA_COVERAGE: ${ENABLE_JAVA_COVERAGE:-1}
      JUNIT_CLASSPATH: ${JUNIT_CLASSPATH:-/opt/java-libs/junit-4.13.2.jar:/opt/java-libs/hamcrest-core-1.3.jar}
      JACOCO_AGENT_PATH: ${JACOCO_AGENT_PATH:-/opt/java-libs/org.jacoco.agent-0.8.12-runtime.jar}
      JACOCO_CLI_PATH: ${JACOCO_CLI_PATH:-/opt/java-libs/org.jacoco.cli-0.8.12-nodeps.jar}
      COMPILE_TIMEOUT_SECONDS: ${COMPILE_TIMEOUT_SECONDS:-20}
      TEST_TIMEOUT_SECONDS: ${TEST_TIMEOUT_SECONDS:-40}
      MAVEN_COMPILE_TIMEOUT_SECONDS: ${MAVEN_COMPILE_TIMEOUT_SECONDS:-300}
      MAVEN_TEST_TIMEOUT_SECONDS: ${MAVEN_TEST_TIMEOUT_SECONDS:-300}
      MAVEN_REPORT_TIMEOUT_SECONDS: ${MAVEN_REPORT_TIMEOUT_SECONDS:-180}
      CONTEXT_EXTRACT_TIMEOUT_SECONDS: ${CONTEXT_EXTRACT_TIMEOUT_SECONDS:-300}
      SANDBOX_RUNNER_ENABLED: ${SANDBOX_RUNNER_ENABLED:-1}
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8090}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-local-dev-runner-token-change-me}
      SANDBOX_RUNNER_TIMEOUT_SECONDS: ${SANDBOX_RUNNER_TIMEOUT_SECONDS:-360}
      MAX_PROJECT_ARCHIVE_BYTES: ${MAX_PROJECT_ARCHIVE_BYTES:-157286400}
      MAX_PROJECT_ARCHIVE_ENTRIES: ${MAX_PROJECT_ARCHIVE_ENTRIES:-10000}
      MAX_PROJECT_UNPACKED_BYTES: ${MAX_PROJECT_UNPACKED_BYTES:-786432000}
      MAX_PROJECT_COMPRESSION_RATIO: ${MAX_PROJECT_COMPRESSION_RATIO:-100}
      METHOD_CONTEXT_EXTRACTOR_JAR: ${METHOD_CONTEXT_EXTRACTOR_JAR:-/app/LLM_Test_Gen/Java_Scripts/method-context-extractor/target/method-context-extractor-0.2.0-SNAPSHOT-jar-with-dependencies.jar}
      MINIO_ENABLED: ${MINIO_ENABLED:-1}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-a3-agent}
      MINIO_SECURE: ${MINIO_SECURE:-0}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      KNOWLEDGE_BASE_ENABLED: ${KNOWLEDGE_BASE_ENABLED:-0}
      STORAGE_DIR: /app/storage
      PROJECT_ROOT: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      milvus:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    volumes:
      - a3_agent_storage:/app/storage
      - a3_agent_maven_cache:/home/app/.m2
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${SANDBOX_WORKER_PIDS_LIMIT:-256}
    mem_limit: ${SANDBOX_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${SANDBOX_WORKER_CPUS:-2}
    init: true
    networks:
      - default
      - sandbox

  storage-init:
    build:
      context: ../..
      dockerfile: LLM_Test_Gen/Agent_App/backend/Dockerfile
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/storage /home/app/.m2 /sandbox-m2 && chown -R 10001:10001 /app/storage /home/app/.m2 /sandbox-m2"]
    volumes:
      - a3_agent_storage:/app/storage
      - a3_agent_maven_cache:/home/app/.m2
      - a3_agent_sandbox_maven_cache:/sandbox-m2

  sandbox-runner:
    build:
      context: ../..
      dockerfile: LLM_Test_Gen/Agent_App/backend/Dockerfile
    command: ["uvicorn", "app.sandbox_runner:APP", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-local-dev-runner-token-change-me}
      MAX_PROJECT_ARCHIVE_BYTES: ${MAX_PROJECT_ARCHIVE_BYTES:-157286400}
      MAX_PROJECT_ARCHIVE_ENTRIES: ${MAX_PROJECT_ARCHIVE_ENTRIES:-10000}
      MAX_PROJECT_UNPACKED_BYTES: ${MAX_PROJECT_UNPACKED_BYTES:-786432000}
      MAX_PROJECT_COMPRESSION_RATIO: ${MAX_PROJECT_COMPRESSION_RATIO:-100}
      SANDBOX_PROCESS_FILE_BYTES: ${SANDBOX_PROCESS_FILE_BYTES:-536870912}
      JACOCO_AGENT_PATH: /opt/java-libs/org.jacoco.agent-0.8.12-runtime.jar
      METHOD_CONTEXT_EXTRACTOR_JAR: /app/LLM_Test_Gen/Java_Scripts/method-context-extractor/target/method-context-extractor-0.2.0-SNAPSHOT-jar-with-dependencies.jar
    depends_on:
      storage-init:
        condition: service_completed_successfully
      maven-proxy:
        condition: service_started
    volumes:
      - a3_agent_sandbox_maven_cache:/home/app/.m2
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${SANDBOX_TMPFS_SIZE:-768m},mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${SANDBOX_RUNNER_PIDS_LIMIT:-128}
    mem_limit: ${SANDBOX_RUNNER_MEMORY_LIMIT:-2g}
    cpus: ${SANDBOX_RUNNER_CPUS:-1.5}
    init: true
    networks:
      - sandbox

  maven-proxy:
    image: nginx:1.27-alpine
    user: "101:101"
    volumes:
      - ./backend/sandbox/maven-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=16m,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    networks:
      - default
      - sandbox

  maven-cache-maintenance:
    profiles: ["maintenance"]
    image: ${A3_RUNTIME_IMAGE:-agent_app-sandbox-runner}
    entrypoint: ["python", "-m", "app.maven_cache_maintenance"]
    command: ["status"]
    environment:
      MAVEN_CACHE_MAX_SIZE_MB: ${MAVEN_CACHE_MAX_SIZE_MB:-1024}
      MAVEN_CACHE_MAX_AGE_DAYS: ${MAVEN_CACHE_MAX_AGE_DAYS:-30}
    volumes:
      - a3_agent_sandbox_maven_cache:/caches/sandbox
      - a3_agent_maven_cache:/caches/worker
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    init: true
    network_mode: none

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  a3_agent_mysql:
  a3_agent_redis:
  a3_agent_storage:
  a3_agent_minio:
  a3_agent_etcd:
  a3_agent_milvus:
  a3_agent_maven_cache:
  a3_agent_sandbox_maven_cache:

networks:
  sandbox:
    internal: true
