server {
    listen 8080;
    server_tokens off;

    location /repository/ {
        proxy_pass https://repo.maven.apache.org/maven2/;
        proxy_set_header Host repo.maven.apache.org;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }

    location / {
        return 404;
    }
}
